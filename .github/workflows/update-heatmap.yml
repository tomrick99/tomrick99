name: Update contribution heatmap

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the latest public contribution calendar
        run: curl --fail --silent --show-error --retry 3 "https://github-contributions-api.jogruber.de/v4/tomrick99?y=last" --output contributions.json
      - name: Generate the animated profile graph
        run: python3 scripts/generate_heatmap.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contributions.json assets/contribution-flow.svg
          git diff --cached --quiet || git commit -m "chore: refresh contribution heatmap"
          git push
